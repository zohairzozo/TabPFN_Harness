# Approved design (2026-10-26).
family: noise_tipping
role: out_of_prior        # test only; never in the context pool or validation
tipping_type: noise_induced
description: >
  Noise-induced tipping in a symmetric double well. The landscape never changes.
  The system starts in the left well and crosses to the right well because the
  noise grows. There is no bifurcation and no critical slowing down.

source:
  citation: >
    Ditlevsen P. D., Johnsen S. J. (2010). Tipping points: Early warning and wishful
    thinking. Geophys. Res. Lett. 37, L19703. doi:10.1029/2010GL044486
  why: "argues that noise-induced transitions give no critical-slowing-down warning"
  status: "citation to be checked"

dynamics: double_well
equation:
  x: "(x - x**3) dt + sigma(t) dW"

state: [x]
initial_state: {kind: value, value: [-1.0]}   # bottom of the left well
parameters:
  ramp_start: 100.0       # sigma = sigma0 before this time
  sigma_max: 0.5
  hold_after_ramp: 400.0  # keep sigma = sigma_max for at most this long

# This family uses its own noise levels: the level sets the starting process noise.
noise_levels:
  N1: {sigma0: 0.10, obs_sd: 0.01}
  N2: {sigma0: 0.15, obs_sd: 0.025}
  N3: {sigma0: 0.20, obs_sd: 0.05}

ramp:
  form: linear_noise      # sigma rises from sigma0 to sigma_max, then holds
  speeds:
    slow: {ramp_duration: 400.0}
    fast: {ramp_duration: 100.0}

observation:
  variables: [x]

series_length_points:
  max: 9000               # ramp_start + slow ramp + hold = 900 time units

tip_detector:
  kind: state_above
  variable: x
  threshold: 0.5
  dwell: 10.0             # after entering, x must stay above dwell_level for 10 time units
  dwell_level: 0.0        # (the right basin); otherwise the entry does not count
  stop_after: 10.0        # counted from the end of the dwell
  description: >
    First time x > 0.5 after which x stays in the right basin (x > 0) for 10 time
    units. At high noise the state can touch x > 0.5 and fall back; that is not a tip.

no_tip_policy: >
  If a trajectory does not tip before the cap, generate() returns tip_time = None and
  a NaN target. The dataset step drops it and writes the count of dropped trajectories
  to results/. Expected to be rare at sigma_max = 0.5.

label:
  kind: time_to_tip
  formula: "clip((t_tip - t) / horizon, 0, 1)"

seed_sets: [D]

scenarios:
  - {id: noise_N1_slow, noise_level: N1, speed: slow}
  - {id: noise_N1_fast, noise_level: N1, speed: fast}
  - {id: noise_N2_slow, noise_level: N2, speed: slow}
  - {id: noise_N2_fast, noise_level: N2, speed: fast}
  - {id: noise_N3_slow, noise_level: N3, speed: slow}
  - {id: noise_N3_fast, noise_level: N3, speed: fast}
