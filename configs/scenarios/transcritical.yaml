# Approved design (2026-10-26).
family: transcritical
role: in_prior
tipping_type: bifurcation
description: >
  Transcritical bifurcation. The state x = 0 is stable for p < 0 and exchanges
  stability with the branch x = p at p_c = 0. There is no jump in the noise-free
  system, but with noise the state can escape past the unstable branch x = p
  and diverge, which is an abrupt failure.

dynamics: transcritical
equation:
  x: "(p(t)*x - x**2) dt + process_sd dW"
notes: >
  Plain normal form. Escapes below the unstable branch are treated as tipping
  events (see tip_detector). See the open question in docs/LABELS.md about how
  often this happens at noise level L3.

state: [x]
initial_state: {kind: value, value: [0.0]}
parameters:
  p0: -1.0
  p_c: 0.0

ramp:
  form: linear
  speeds:
    slow: {time_to_critical: 400.0}
    fast: {time_to_critical: 100.0}
  run_after_critical: 0.25

noise_levels: [L1, L2, L3]

observation:
  variables: [x]

series_length_points:
  slow: 5000
  fast: 1250

tip_detector:
  kind: escape_below_branch   # event: x < p(t) - margin
  margin: 0.5
  stop_after: 0.0             # stop the simulation at an escape
  tip_at_critical: true       # if there is no earlier escape, the tip is when p crosses p_c
  description: >
    The earlier of: (a) the time p(t) crosses p_c; (b) the first time x < p(t) - 0.5
    (escape past the unstable branch). After an escape the simulation stops.

label:
  kind: bifurcation_distance
  formula: "clip((p_c - p(t)) / (p_c - p0), 0, 1)"

seed_sets: [A, B, C]

scenarios:
  - {id: transcritical_L1_slow, noise_level: L1, speed: slow}
  - {id: transcritical_L1_fast, noise_level: L1, speed: fast}
  - {id: transcritical_L2_slow, noise_level: L2, speed: slow}
  - {id: transcritical_L2_fast, noise_level: L2, speed: fast}
  - {id: transcritical_L3_slow, noise_level: L3, speed: slow}
  - {id: transcritical_L3_fast, noise_level: L3, speed: fast}
