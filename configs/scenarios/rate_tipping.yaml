# Approved design (2026-10-26).
family: rate_tipping
role: out_of_prior        # test only; never in the context pool or validation
tipping_type: rate_induced
description: >
  Rate-induced tipping (R-tipping). A stable state exists for every fixed value of
  lambda, so there is no bifurcation. The system tips only because lambda moves
  faster than the state can follow.

source:
  citation: >
    Ashwin P., Wieczorek S., Vitolo R., Cox P. (2012). Tipping points in open systems:
    bifurcation, noise-induced and rate-dependent examples in the climate system.
    Phil. Trans. R. Soc. A 370, 1166-1184. doi:10.1098/rsta.2011.0306
  form_used: "dx/dt = (x + lambda)^2 - 1, the canonical R-tipping example in that paper"
  status: "citation and equation to be checked against the paper"

dynamics: rate_saddle
equation:
  x: "(((x + lambda(t))**2 - 1) / tau) dt + process_sd dW"
notes: >
  In the moving frame y = x + lambda, dy/dt = (y^2 - 1)/tau + r while lambda ramps at
  rate r. A stable state y = -sqrt(1 - r*tau) exists only if r < 1/tau. So for an
  unbounded linear ramp the critical rate is r_c = 1/tau. Our ramp is finite
  (lambda stops at lambda_max), which can push the effective critical rate slightly
  above 1/tau when r is close to r_c. The chosen rates are far from r_c.

state: [x]
initial_state: {kind: value, value: [-1.0]}   # stable state at lambda = 0
parameters:
  tau: 50.0               # time scale; r_c = 1 / tau = 0.02
  lambda_max: 10.0
  ramp_start: 300.0       # lambda = 0 before this time

ramp:
  form: linear_finite     # lambda(t) = clip(rate * (t - ramp_start), 0, lambda_max)
  speeds:
    slow: {rate: 0.03}    # 1.5 * r_c, tips about 180 time units after ramp start
    fast: {rate: 0.06}    # 3.0 * r_c, tips about 80 time units after ramp start

noise_levels: [L1, L2, L3]

observation:
  variables: [x]

series_length_points:
  max: 10000              # 1000 time units cap; real length ends at tip + stop_after

tip_detector:
  kind: moving_frame_above   # event: x + lambda(t) > threshold
  threshold: 2.0
  stop_after: 10.0           # stop the simulation 10 time units after the tip
  description: "first time x + lambda(t) > 2 (past the point of no return)"

label:
  kind: time_to_tip
  formula: "clip((t_tip - t) / horizon, 0, 1)"

required_unit_test: >
  Noise-free (process_sd = 0): with r = 0.5 * r_c the state tracks the moving stable
  state and never tips; with r = 1.5 * r_c and r = 3 * r_c it tips before lambda
  reaches lambda_max. The test lives in tests/test_scenarios.py.

seed_sets: [D]

scenarios:
  - {id: rate_L1_slow, noise_level: L1, speed: slow}
  - {id: rate_L1_fast, noise_level: L1, speed: fast}
  - {id: rate_L2_slow, noise_level: L2, speed: slow}
  - {id: rate_L2_fast, noise_level: L2, speed: fast}
  - {id: rate_L3_slow, noise_level: L3, speed: slow}
  - {id: rate_L3_fast, noise_level: L3, speed: fast}
