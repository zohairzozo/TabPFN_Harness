# Approved design (2026-10-26).
family: control_ou
role: control             # never tips; appears in every split
tipping_type: none
description: Stationary Ornstein-Uhlenbeck process. Nothing changes over time.

dynamics: ou
equation:
  x: "(-theta * x) dt + process_sd dW"

state: [x]
initial_state: {kind: value, value: [0.0]}
parameters:
  theta: 1.0              # same recovery rate as the bifurcation families at p0 = -1

ramp:
  form: none

noise_levels: [L1, L2, L3]

observation:
  variables: [x]

series_length_points:
  fixed: 5000

tip_detector:
  kind: none

label:
  kind: control
  formula: "1 everywhere"

seed_sets: [A, B, C, D]

scenarios:                 # one per noise level; there is no ramp
  - {id: ou_L1, noise_level: L1, speed: null}
  - {id: ou_L2, noise_level: L2, speed: null}
  - {id: ou_L3, noise_level: L3, speed: null}
